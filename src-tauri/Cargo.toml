[package]
name = "uskmaker"
version = "0.22.1"
description = "USKMaker - gerador de pacotes de karaokê UltraStar com IA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }

# Fase 1: núcleo já validado (ultrastar_writer) - reaproveitado aqui em
# vez de duplicar a lógica. Ver ../rust-core/README.md.
uskmaker-core = { path = "../rust-core" }
tauri-plugin-dialog = "2"
tauri-plugin-http = "~2.7"  # mesma série do @tauri-apps/plugin-http no npm (o CLI recusa versões desalinhadas)
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
