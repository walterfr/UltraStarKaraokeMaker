name: Publish to itch.io

# Publica automaticamente os instaladores do USKMaker no itch.io (walterfr/uskmaker)
# usando a ferramenta oficial Butler (https://itch.io/docs/butler/).
#
# Precisa do secret BUTLER_API_KEY configurado no repositório GitHub:
# https://itch.io/user/settings/api-keys
# Se o secret não estiver configurado, o workflow avisa e conclui sem falhar.
#
# POR QUE É ENCADEADO (workflow_call) E NÃO `on: release`: o Release é criado
# pelo softprops/action-gh-release dentro do build-windows.yml usando o
# GITHUB_TOKEN, e eventos gerados com esse token NÃO disparam outros workflows
# (regra do GitHub para evitar execuções recursivas). Com `release: published`
# este workflow nunca rodava sozinho. Por isso o build-windows.yml o chama como
# job `publish-itch` (needs: build) em tags v*, igual ao `publish-winget`.
#
# Disparo manual (republicar uma versão já lançada):
#   gh workflow run publish-itch.yml -f release_tag=vX.Y.Z

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag da release (ex.: v2.5.1) para publicar no itch.io"
        type: string
        required: false
        default: ""
    secrets:
      BUTLER_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (ex.: v2.5.1) para publicar no itch.io"
        type: string
        required: false
        default: ""

# Só lê os assets do Release (gh release download).
permissions:
  contents: read

jobs:
  publish-itch:
    name: Publish to itch.io (Butler)
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se BUTLER_API_KEY está configurada
        id: check-secret
        env:
          BUTLER_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_KEY" ]; then
            echo "::warning::BUTLER_API_KEY não configurada nos Secrets do repositório. Configure em https://itch.io/user/settings/api-keys e adicione em Settings > Secrets > Actions."
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: Determinar Tag da Release
        if: steps.check-secret.outputs.has_key == 'true'
        id: vars
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Input explícito (workflow_call / dispatch) tem prioridade; sem ele,
          # só vale o ref se for uma tag (dispatch feito a partir da tag).
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Nenhuma tag de release informada: release_tag está vazio e o ref atual ($REF_NAME) não é uma tag. Rode de novo informando release_tag (ex.: v2.6.0)."
            exit 1
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Aguardar e Baixar Artefatos do Release
        if: steps.check-secret.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "Aguardando instaladores ficarem disponíveis no release $TAG..."
          MAX_RETRIES=40
          COUNT=0
          mkdir -p dist-win dist-linux
          while [ $COUNT -lt $MAX_RETRIES ]; do
            gh release download "$TAG" --repo "$REPO" --pattern "*_x64-setup.exe" --dir ./dist-win 2>/dev/null || true
            gh release download "$TAG" --repo "$REPO" --pattern "*.AppImage" --dir ./dist-linux 2>/dev/null || true
            
            HAS_WIN=$(ls ./dist-win/*.exe 2>/dev/null | wc -l)
            HAS_LINUX=$(ls ./dist-linux/*.AppImage 2>/dev/null | wc -l)
            
            if [ "$HAS_WIN" -gt 0 ] && [ "$HAS_LINUX" -gt 0 ]; then
              echo "Instaladores Windows e Linux baixados com sucesso!"
              ls -la ./dist-win/ ./dist-linux/
              exit 0
            fi
            echo "Aguardando artefatos (tentativa $((COUNT+1))/$MAX_RETRIES). Aguardando 30s..."
            sleep 30
            COUNT=$((COUNT+1))
          done
          echo "Aviso: Timeout aguardando ambos os artefatos. Prosseguindo com o que estiver disponível."

      - name: Instalar Butler
        if: steps.check-secret.outputs.has_key == 'true'
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          sudo mv /tmp/butler/butler /usr/local/bin/butler
          rm -rf butler.zip /tmp/butler
          butler -V

      - name: Publicar canal Windows no itch.io
        if: steps.check-secret.outputs.has_key == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          WIN_INSTALLER=$(ls ./dist-win/*_x64-setup.exe 2>/dev/null | head -n 1)
          if [ -n "$WIN_INSTALLER" ]; then
            echo "Enviando $WIN_INSTALLER para walterfr/uskmaker:windows..."
            butler push "$WIN_INSTALLER" walterfr/uskmaker:windows --userversion "$VERSION"
          else
            echo "Nenhum instalador Windows encontrado para envio."
          fi

      - name: Publicar canal Linux no itch.io
        if: steps.check-secret.outputs.has_key == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          LINUX_APPIMAGE=$(ls ./dist-linux/*.AppImage 2>/dev/null | head -n 1)
          if [ -n "$LINUX_APPIMAGE" ]; then
            echo "Enviando $LINUX_APPIMAGE para walterfr/uskmaker:linux..."
            butler push "$LINUX_APPIMAGE" walterfr/uskmaker:linux --userversion "$VERSION"
          else
            echo "Nenhum AppImage Linux encontrado para envio."
          fi
