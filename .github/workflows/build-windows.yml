name: Build Windows installer

# Compila o instalador do USKMaker no Windows e o deixa disponível para
# download como artefato da execução.
#
# PARA QUE ISTO EXISTE: o repositório só tinha o workflow de publicação no
# winget, que roda DEPOIS de um release já existir. Sem um build de CI, testar
# uma alteração exigia a cadeia de desenvolvimento inteira (Rust + Node +
# Python) instalada na máquina de quem testa. Aqui a montagem acontece nos
# runners do GitHub e o resultado é um .exe para baixar - útil tanto para CI
# quanto para quem só quer experimentar uma branch sem virar desenvolvedor.
#
# O sidecar Python NÃO é empacotado aqui (nem deveria): o app baixa o ambiente
# de IA na primeira execução, via setup-sidecar.ps1. Este build produz o app.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Sem cache, cada execução recompila as centenas de crates do Tauri do
      # zero (~10 min). Com cache, uma alteração só no nosso código leva ~2.
      - name: Cache das dependências Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Instalar dependências do front-end
        run: npm ci

      # Roda ANTES do build pesado: um erro de tipo no React aparece em
      # segundos, não depois de dez minutos compilando Rust.
      - name: Checar tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Testes do rust-core
        run: cargo test --manifest-path rust-core/Cargo.toml

      # O tauri.conf.json já roda `npm run build` (beforeBuildCommand), então
      # o front-end é montado dentro deste passo.
      - name: Build do instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: USKMaker-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Gerar pacote MSIX oficial (Microsoft Store)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-msix.ps1

      - name: Publicar o pacote MSIX como artefato
        uses: actions/upload-artifact@v4
        with:
          name: USKMaker-msix-package
          path: packaging/msix/*.msix
          if-no-files-found: error
          retention-days: 30

      - name: Extrair notas da versão do CHANGELOG.md e gerar latest.json (OTA)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $pt = [System.IO.File]::ReadAllText("CHANGELOG.md", [System.Text.Encoding]::UTF8)
          $en = [System.IO.File]::ReadAllText("CHANGELOG.en.md", [System.Text.Encoding]::UTF8)
          $pat = "(?ms)^##\s+\[$([regex]::Escape($ver))\].*?(?=^##\s+\[|\Z)"
          $notes = @()
          if ($pt -match $pat) { $notes += $Matches[0].Trim() }
          if ($en -match $pat) { $notes += "---`n`n" + $Matches[0].Trim() }
          if (-not $notes.Count) { $notes += "Release USKMaker v$ver" }
          $notesStr = ($notes -join "`n`n")
          [System.IO.File]::WriteAllText("release-notes.md", $notesStr, [System.Text.UTF8Encoding]::new($false))

          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sigFile = "$($exe.FullName).sig"
          if ($exe -and (Test-Path $sigFile)) {
            $sig = [System.IO.File]::ReadAllText($sigFile, [System.Text.Encoding]::UTF8).Trim()
            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
            $platforms = @{}
            try {
              $existing = Invoke-RestMethod -Uri "https://github.com/${{ github.repository }}/releases/download/$tag/latest.json" -ErrorAction Stop
              if ($existing.platforms) {
                $existing.platforms.PSObject.Properties | ForEach-Object { $platforms[$_.Name] = $_.Value }
              }
            } catch {}
            $entry = @{ signature = $sig; url = $url }
            $platforms["windows-x86_64"] = $entry
            $platforms["windows-x86_64-nsis"] = $entry
            $latest = [ordered]@{
              version = $ver
              notes = $notesStr
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = $platforms
            }
            [System.IO.File]::WriteAllText("latest.json", ($latest | ConvertTo-Json -Depth 6), [System.Text.UTF8Encoding]::new($false))
          }

      - name: Anexar instalador e manifesto OTA ao Release do GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: USKMaker ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            packaging/msix/USKMaker_*.msix
            latest.json

  # Os testes do sidecar rodam em paralelo, em Linux (são lógica pura - não
  # precisam de GPU, de ffmpeg nem de Windows).
  sidecar-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar o mínimo para os testes de lógica
        run: pip install pytest numpy
      - name: pytest
        working-directory: python-sidecar
        # Só os módulos de lógica pura: os demais importam a pilha de IA
        # inteira (torch/whisperx/demucs), que não cabe num runner de CI.
        run: |
          python -m pytest \
            tests/test_video_export_logic.py \
            tests/test_filenames_logic.py \
            tests/test_ultrastar_format_conventions.py \
            -v

  publish-winget:
    name: Publish to WinGet
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: walterfr.USKMaker
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ${{ github.repository_owner }}
          release-tag: ${{ github.ref_name }}
