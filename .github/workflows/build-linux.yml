name: Build Linux packages

# Compila o USKMaker para Linux (.deb, .rpm e AppImage) e deixa os pacotes
# disponíveis como artefato da execução - o equivalente Linux do
# build-windows.yml. Os alvos vêm do src-tauri/tauri.linux.conf.json, que o
# Tauri mescla sozinho por cima do tauri.conf.json quando roda no Linux.
#
# Como no Windows, o sidecar Python NÃO é empacotado: o app instala o ambiente
# de IA na primeira execução, via setup-sidecar.sh.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    # 22.04 e não ubuntu-latest: o AppImage carrega a glibc de onde foi
    # compilado como piso - montado no 22.04 roda em distros de 2022 para cá;
    # montado no 24.04 recusaria abrir no 22.04 e derivadas (Mint 21, Pop 22).
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lista das dependências de sistema do Tauri v2 (tauri.app, "Linux
      # Prerequisites"), mais libdbus-1-dev para as notificações.
      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache das dependências Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Instalar dependências do front-end
        run: npm ci

      - name: Build do front-end (dist)
        run: npm run build

      - name: Testes do rust-core
        run: cargo test --manifest-path rust-core/Cargo.toml

      # Testes do src-tauri: no Windows eles não rodam no CI, mas aqui cobrem
      # o platform.rs (pasta XDG, layout do venv, grupo de processo).
      - name: Testes do src-tauri
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build dos pacotes
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      # O bundler do Tauri v2 converte "USKMaker" (camelCase) em "usk-maker"
      # no DEBIAN/control. Normalizamos para "uskmaker" para que `apt`, `deb-get`
      # e `pacstall` enxerguem o pacote como `uskmaker`.
      - name: "Normalizar Package: uskmaker no .deb"
        run: |
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            tmp_dir=$(mktemp -d)
            dpkg-deb -R "$deb" "$tmp_dir"
            sed -i 's/^Package: usk-maker$/Package: uskmaker\nReplaces: usk-maker\nConflicts: usk-maker/' "$tmp_dir/DEBIAN/control"
            dpkg-deb -Zgzip -b "$tmp_dir" "$deb"
            rm -rf "$tmp_dir"
          done

      - name: Publicar os pacotes como artefato
        uses: actions/upload-artifact@v4
        with:
          name: USKMaker-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Extrair notas da versão do CHANGELOG.md e atualizar latest.json (OTA)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $pt = [System.IO.File]::ReadAllText("CHANGELOG.md", [System.Text.Encoding]::UTF8)
          $en = [System.IO.File]::ReadAllText("CHANGELOG.en.md", [System.Text.Encoding]::UTF8)
          $pat = "(?ms)^##\s+\[$([regex]::Escape($ver))\].*?(?=^##\s+\[|\Z)"
          $notes = @()
          if ($pt -match $pat) { $notes += $Matches[0].Trim() }
          if ($en -match $pat) { $notes += "---`n`n" + $Matches[0].Trim() }
          if (-not $notes.Count) { $notes += "Release USKMaker v$ver" }
          $notesStr = ($notes -join "`n`n")
          [System.IO.File]::WriteAllText("release-notes.md", $notesStr, [System.Text.UTF8Encoding]::new($false))

          $appimg = Get-ChildItem "src-tauri/target/release/bundle/appimage/*.AppImage" | Select-Object -First 1
          $sigFile = "$($appimg.FullName).sig"
          if ($appimg -and (Test-Path $sigFile)) {
            $sig = [System.IO.File]::ReadAllText($sigFile, [System.Text.Encoding]::UTF8).Trim()
            $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($appimg.Name)"
            $platforms = @{}
            try {
              $existing = Invoke-RestMethod -Uri "https://github.com/${{ github.repository }}/releases/download/$tag/latest.json" -ErrorAction Stop
              if ($existing.platforms) {
                $existing.platforms.PSObject.Properties | ForEach-Object { $platforms[$_.Name] = $_.Value }
              }
            } catch {}
            $entry = @{ signature = $sig; url = $url }
            $platforms["linux-x86_64"] = $entry
            $platforms["linux-x86_64-appimage"] = $entry
            $latest = [ordered]@{
              version = $ver
              notes = $notesStr
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = $platforms
            }
            [System.IO.File]::WriteAllText("latest.json", ($latest | ConvertTo-Json -Depth 6), [System.Text.UTF8Encoding]::new($false))
          }

      - name: Anexar pacotes e manifesto OTA ao Release do GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: USKMaker ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            latest.json
